name: bb4
services:
  caddy:
    build:
      context: ./caddy
    container_name: bb_caddy
    restart: always
    # original image downgrades user but that seems not to work
    # see: https://caddy.community/t/basic-docker-compose-setup-failing/6892/7?u=alexander_gabriel
    user: root
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      # the static site: rsynced by npm run deploy
      - ./dist:/srv:ro
      - caddy_certs:/data
      - caddy_config:/config
volumes:
  caddy_certs:
  caddy_config:
